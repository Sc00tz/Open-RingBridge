name: Release

# Push a tag like v0.1.0 to build the signed APK and the hub image, and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the SIGNING_* repository secrets first (see README, Releases)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > release.jks
      - name: Tests and signed APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "OpenRingBridge-${VERSION_NAME}.apk"
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/OpenRingBridge-*.apk

  hub-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push (amd64 and arm64, for a PC or a Raspberry Pi)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Open RingBridge hub
          tags: |
            ghcr.io/sc00tz/open-ringbridge-hub:${{ steps.version.outputs.version }}
            ghcr.io/sc00tz/open-ringbridge-hub:latest

  release:
    needs: [apk, hub-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: OpenRingBridge-*.apk
          generate_release_notes: true
          body: |
            **Android app:** download `OpenRingBridge-*.apk` below and open it on your phone (Android 12 or newer).
            **Hub:** `docker compose up -d` with [compose.yaml](https://github.com/${{ github.repository }}/blob/main/compose.yaml), image `ghcr.io/sc00tz/open-ringbridge-hub:latest`.
