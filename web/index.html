<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ring Dashboard</title>
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div class="shell">
  <header class="appbar">
    <h1 id="title">Today</h1>
    <button id="sync" class="btn tonal">Sync</button>
  </header>
  <div id="syncline" class="syncline" role="status"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="navbar" aria-label="Main">
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg><span>Today</span></a>
    <a href="#sleep" data-tab="sleep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><span>Sleep</span></a>
    <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Trends</span></a>
    <a href="#measure" data-tab="measure"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Record</span></a>
    <a href="#device" data-tab="device"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg><span>Ring</span></a>
  </nav>
</div>
<div id="tip" class="tip" hidden></div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
